services:
  senyao-llm-benchmark:
    build: .
    container_name: senyao-llm-benchmark
    ports:
      - "18087:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./tasks:/app/tasks:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
