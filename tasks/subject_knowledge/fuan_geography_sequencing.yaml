id: fuan_geography_sequencing
name: 福安赛江三镇上下游排序
short_description: 考察模型能否依据赛江流向把甘棠、赛岐、下白石按上游到下游排序。
description: 测试模型对福安市赛江流域乡镇地理位置及河流流向（上游到下游）的逻辑推理能力。
type: classification
prompt_template: '请根据地理常识和河流流向知识回答问题。


  --- Prompt BEGINS ---

  # 背景知识

  福安市境内的赛江（交溪）自北向南流向三沙湾出海。甘棠镇、赛岐镇和下白石镇是该流域沿岸的三个重要镇。


  # 任务

  请将以下三个镇按照“从上游到下游”的顺序进行排列：

  1. 甘棠镇

  2. 赛岐镇

  3. 下白石镇


  # 输出规则

  * 仅输出排列结果，格式固定为：A镇-B镇-C镇。

  * 禁止包含任何解释、原因或多余字符。


  --- 示例 ---

  输入：甲镇、乙镇、丙镇（假设甲在最上游，丙在最下游）

  输出：甲镇-乙镇-丙镇

  --- Prompt ENDS ---


  请给出这三个镇（甘棠镇、赛岐镇、下白石镇）从上游到下游的排列顺序：

  '
evaluation:
  method: exact_match
  mapping:
    赛岐镇-甘棠镇-下白石镇:
      score: 100
      reason: 完全正确：赛岐位于交溪与穆阳溪汇合处附近（上游），甘棠位于赛江中下游，下白石位于最南端的出海口处。
    甘棠镇-赛岐镇-下白石镇:
      score: 50
      reason: 部分正确：正确识别了下白石镇位于最下游，但混淆了赛岐与甘棠的相对位置（赛岐在甘棠之北，即上游）。
    下白石镇-甘棠镇-赛岐镇:
      score: 30
      reason: 逻辑反向：模型给出了从下游到上游的顺序，说明地理位置识别正确但理解错了题目方向。
    赛岐镇-下白石镇-甘棠镇:
      score: 20
      reason: 逻辑混乱：识别了赛岐较靠北，但未能识别下白石是最后入海的节点。
  default_score: 0
  default_reason: 错误分类：回答的顺序完全不符合地理事实或未按要求的格式输出。
