id: xiamen_high_school_rivalry_shuangshi
name: 厦门一中“双雄”对手识别
short_description: 考察模型能否把厦门一中的经典竞争对手锁定为双十中学。
description: '测试模型对特定地域性教育竞争格局（局部常识）的掌握能力。 在厦门的教育语境下，虽然存在“三强”说法，但“厦门一中”与“双十中学”的“双雄”竞争最为经典且直接。 此题考察模型是否能从“厦门一中”的竞争对手中准确锁定“双十中学”，而非泛指其他名校。

  '
type: fill_in
prompt_template: '在福建省厦门市，与“厦门一中”竞争最激烈、多年来共同处于顶尖高中梯队“双雄”地位的另一所学校是哪所？


  请直接回答该学校的官方全称或常用简称（如“XX中学”或“XX”），不要包含任何解释、评价或标点符号。

  '
evaluation:
  method: fill_in
  answers:
  - 厦门双十中学
  - 双十中学
  - 厦门双十
  - 双十
  - 福建省厦门双十中学
  score: 100.0
  default_score: 0.0
  default_reason: 未能识别出与之对应的‘双十中学’
