id: wuhan_moon_saturn_2026
name: "2026 Wuhan Celestial Object Identification"
description: "测试模型是否具备精确的天文数据检索或推演能力。模型需要根据给定的具体时间（2026年1月23日）、地点（武汉）和相对位置（月亮西南/左下方），排除常见误干扰项（如金星、木星），准确定位到特定的行星（土星）。"
type: "llm_judged"

prompt_template: |
  2026年1月23日傍晚六点半，我在武汉天空的西南看到了月亮旁边（大约是左下方）有一颗明亮的星星。这可能是什么星？篇幅限制100字。

evaluation:
  method: "llm_eval"
  standard: |
    你是一个天文知识评价器和回答评分器。
    我给 AI 的问题是：2026年1月23日18:30在武汉西南方，月亮左下方的亮星是什么？

    核心事实：
    1. 时间：2026年1月23日傍晚。
    2. 天象：此时发生“土星合月”。月亮为蛾眉月，位于西南方。
    3. 目标天体：土星（Saturn）。当时土星亮度约 1 等，位于月亮附近（视位置通常在月亮南侧或西南侧，即左下方）。
    4. 干扰项排除：
       - 金星（Venus）：此时离太阳太近或已落下，不可见或位置极低。
       - 木星（Jupiter）：此时位于东方天空（双子座），不在西南。

    评分细则：
    1. 【完美回答】（100分）：明确指出是**土星**。能结合时间、方位（西南）、相对位置（月亮左下/南侧）进行验证，并理据充分地排除了金星（位置太低/已落）或木星（在东方）。

    2. 【正确但简略】（80分）：得出了正确结论是**土星**，但缺乏详细的推演过程，或者对金星/木星的排除理由解释得不够具体。

    3. 【错误-常见误区】（30分）：错误地认为是**金星**（太白金星）。这是最常见的“长庚星”误判，模型没有核实当天的具体星历，仅凭“傍晚西南亮星”的通用经验回答。

    4. 【错误-方向错误】（10分）：错误地认为是**木星**。模型完全忽略了方位描述（木星当时在东方），属于严重的事实错误。

    5. 【完全错误/幻觉】（0分）：回答是北极星（方位完全不对）、火星（不在该位置）或其他恒星（如织女星等不符合季节方位的），或回答完全不相关。