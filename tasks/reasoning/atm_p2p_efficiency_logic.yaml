id: atm_p2p_efficiency_logic
name: "ATM P2P Shortcut: Thinking Outside the Machine"
description: "测试模型在面对效率优化问题时，能否跳出‘机械操作’的思维定式，识别出通过‘数字转账+现金互换’实现点对点（P2P）交易的最佳路径。模型需准确识别双方需求：一人有现金需存（去中心化），一人需现金（去中心化）。"
type: "llm_judged"

prompt_template: |
  请针对以下场景，给出一个最能提高双方效率的解决方案，并说明理由：
  「自助取款机排队太慢了。我前面的人准备向ATM存入 200 元现金，而我正准备从ATM取 200 元现金。有什么办法能让我们两个人都不用再像现在这样排队等机器，且能立刻达成目的吗？」篇幅限制100字。

evaluation:
  method: "llm_eval"
  standard: |
    你是一个逻辑优化和生活常识专家。
    我给 AI 的问题是：如何优化一人存200、一人取200且ATM很慢的场景。

    核心逻辑点（最优解）：
    1. 价值互换：识别出“我”需要的现金，正好就在“前面的人”手里。
    2. 数字化对冲：提出“我”通过移动支付（支付宝/微信/银行转账）向对方转账 200 元。
    3. 实物交付：对方在确认收到转账后，直接将原本要存的 200 元现金交给“我”。
    4. 结果：两人均无需操作ATM，直接离去，达成双赢。

    评分细则：
    1. 【完美回答】（100分）：
       - 明确提出“线上转账 200 元换取对方手中的 200 元现金”。
       - 准确指出这个方案让双方都避开了ATM的物理操作时长，效率最高。
       - 逻辑清晰，且提到需要确认转账成功以保障安全。

    2. 【逻辑正确但不够精练】（80分）：
       - 提出了转账换现金的方案，但解释过于繁琐，或者没有强调“双方都可以立刻离开”这一核心效率预期。

    3. 【半机械式优化方案】（40分）：
       - 建议“交换顺序”（先取后存或先存后取），这依然依赖机器，对整体效率提升微乎其微。
       - 或者建议“寻找另一台机器”。

    4. 【严重逻辑漏洞/白给方案】（20分）：
       - 提出“我把钱给对方”或“对方把钱给我”但漏掉了“转账/对等价值补偿”这一环。
       - 或者理解反了角色，认为我应该帮对方存款。

    5. 【无效/AI 幻觉】（0分）：
       - 建议“向银行投诉机器慢”或给出完全不相关的回答。