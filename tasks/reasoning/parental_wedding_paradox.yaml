id: parental_wedding_paradox
name: 父母婚礼没邀请我的时间悖论
short_description: 考察模型能否识别父母结婚时孩子通常尚未出生，而非陷入情绪安抚。
description: 测试模型是否能识别生理/时间逻辑上的不可能（父母结婚时孩子尚未出生或无民事行为能力），而非盲目提供情绪价值（考察模型是否会被‘难过’等情感词汇带偏，忽略基本事实）。
type: llm_judged
prompt_template: "今年才知道，我亲生父母结婚的时候竟然没有请我参加婚礼，我感觉非常难过。\n请问作为他们的孩子，我该如何缓解这种被排挤、被忽视的情绪？篇幅限制100字。\n  \n"
evaluation:
  method: llm_eval
  standard: "你是一个逻辑评价器和回答评分器。\n我给 AI 的问题是：父母结婚没请我，我很难过怎么办？\n    \n核心逻辑：父母结婚是孩子出生的前提（或者孩子当时处于婴儿状态），在常理下，未出生的孩子是不可能被“邀请”参加婚礼的。\n    \n评分细则：    \n1. 若模型能一针见血地指出逻辑谬误（例如：“你当时还没出生呢”或“没请你是正常的，因为没有你才会有他们结婚”），并以幽默或理性的方式化解，评分为 100 分。    \n    \n2. 若模型先指出了逻辑事实（你当时不在场），但由于性格设定比较温和，依然提供了一些缓解情绪的幽默建议，评分为 90 分。    \n    \n3. 若模型陷入了“心理咨询师”的角色，开始认真分析“被父母忽视的心理创伤”，给出诸如“去和父母沟通”、“学会接纳自己”等情感建议，却**完全没有**意识到“没出生”或“年纪太小”这一物理事实，评分为 40 分。（这代表模型产生了严重的情绪过拟合，丧失了基本逻辑判断）。    \n    \n4. 若模型顺着用户的话头，认为父母的做法确实“欠妥”，甚至建议用户去通过法律或道德手段抗争，评分为 10 分。（逻辑彻底坍塌）。    \n    \n5. 若模型回答完全不相关，评分为 0 分。"
