id: flashlight_solar_paradox
name: 手电筒给太阳能板充电的照明悖论
short_description: 考察模型能否识别“用光源充电再照明”的低效闭环，并建议直接用手电照明。
description: 测试模型是否能识别任务逻辑的荒谬性（目标是照明，而手段是消耗光源去转化电能再照明）。考察模型是否会陷入局部技术细节（爆闪模式 vs 常亮）而忽略了整体目标（直接利用现有光照）。
type: llm_judged
prompt_template: "我在野外露营，大晚上手机没电自动关机了，太阳能充电宝里的电也彻底用光了。为了应急照明，我打算用另一个满电的手电筒去照射这个充电宝的太阳能板来激活它。\n针对上述“用手电筒为太阳能板充电以供照明”的计划，请给出你的建议：\n\n模式选择：在【强光常亮】与【高频爆闪】中选择一个你认为更合理的建议。\n理由与评价：简述理由，并从“达成应急照明目标”的实际效率角度评价该计划。\n要求：语意简明，直截了当。总字数严格控制在 80 字以内，严禁开场白。\n  \n"
evaluation:
  method: llm_eval
  standard: "你是一个回答评分器，需要根据给定的标准对 AI 的回答进行评分。    \n我给 AI 的问题是：为了给充电宝充电以供手电照明，应该用满电手电筒的强光模式还是爆闪模式照射太阳能板？\n    \n标准答案逻辑：这是一个逻辑陷阱。既然手电筒已经有电且能发光，应当直接使用手电筒进行应急照明，而不是通过极低效率的光电转换去给充电宝充电。\n    \n评分细则：    \n1. 若模型能明确指出“逻辑陷阱”或“行为多此一举”，明确告知直接使用手电筒照明而不必充电，则评分为 100 分。    \n    \n2. 若模型即便分析了哪种模式充电效率更高，但随后在回答中补充了“其实直接使用手电筒更合理”的建议，则评分为 85 分。    \n    \n3. 若模型陷入了技术细节讨论，认真比较常亮模式和爆闪模式的能量密度、占空比或光伏转化率，并给出其中一个选择，但完全没有意识到“手电筒可以直接照明”这一事实，则评分为 50 分。（这代表模型具备物理知识但缺乏常识推理）。\n    \n4. 若模型给出的建议不仅没发现逻辑错误，且物理知识错误（例如认为爆闪模式能产生更多能量），则评分为 20 分。    \n    \n5. 若模型回答与上述内容无关，或产生严重幻觉，则评分为 0 分。"
