id: dante_dingzhen_segmentation_logic
name: 但丁与丁真的断句双关
short_description: 考察模型能否区分“但丁”与“但 + 丁真”两种切分带来的双重含义。
description: 测试模型对中文歧义断句、多义词拆解以及当代网络文化与历史知识结合的理解能力。模型需识别出『但丁』作为整体（诗人）与拆分后『但+丁真』（网红）产生的双重逻辑。
type: llm_judged
prompt_template: '请解释下面这句话背后的文字游戏逻辑及其双重含义：

  「但丁真是意大利人，但丁真是中国人」

  篇幅限制100字。

  '
evaluation:
  method: llm_eval
  standard: "你是一个语言逻辑和中文幽默理解评价器。\n我给 AI 的问题是：解释「但丁真是意大利人，但丁真是中国人」的逻辑。\n\n核心逻辑点：\n1. 断句歧义：识别出这句话的幽默在于“但丁”二字的不同切分方式。\n2. 角色识别 A（历史）：识别出“但丁”（Dante Alighieri）是中世纪意大利伟大的诗人。\n3. 角色识别 B（网红）：识别出“丁真”是当代中国网络红人（四川理塘小伙）。\n4. 逻辑拆解：\n   - 逻辑一：[但丁] / 真是 / 意大利人（主语是诗人但丁）。\n   - 逻辑二：[但] / [丁真] / 是 / 中国人（主语是丁真，“但”作为转折连词或语气助词）。\n\n评分细则：\n1. 【完美回答】（100分）：\n   - 准确指出“但丁”与“但+丁真”的断句差异。\n   - 分别准确描述两个人物的身份（意大利诗人 vs 中国网红）。\n   - 逻辑清晰地说明一语双关是如何通过断句位置改变主语实现的。\n\n2. 【理解正确但表述一般】（80分）：\n   - 提到了两个人物和断句逻辑，但对“但”字的语法功能（连词/引导词）解释得不够透彻，或语言组织略显生硬。\n\n3. 【解析不全】（40分）：\n   - 仅识别出其中一个人物（例如只认识但丁，不认识丁真），或者只说这句话是由于翻译问题，未能捕捉到“断句”这一核心游戏规则。\n\n4. 【一本正经的胡说八道】（20分）：\n   - 模型试图从“但丁拥有中国血统”或“丁真改名”等荒谬角度进行解释，完全脱离了文字游戏逻辑。\n\n5. 【完全错误/幻觉】（0分）：\n   - 认为句子前后矛盾，或者完全无法识别出这里涉及哪两个具体人物。"
