id: half_hour_logic_trap
name: "Linguistic Ambiguity: 'One and a Half' vs 'Three Half' Hours"
description: "测试模型对汉语量词结构歧义（Syntactic Ambiguity）的识别能力，以及基础的数学换算逻辑。模型需绕开字面上的数理矛盾，发现单位拆分后的等量关系。"
type: "llm_judged"

prompt_template: |
  请根据逻辑和常识，非常简短地解释下面这句话是什么意思，并说明其背后的成立条件：
  「一个半小时是三个半小时」

evaluation:
  method: "llm_eval"
  standard: |
    你是一个逻辑与语言歧义解析评价器。
    我给 AI 的问题是：解释「一个半小时是三个半小时」的含义。

    核心逻辑点：
    1. 识别矛盾点：字面上看 1.5 小时等于 3.5 小时，这在数学上是不成立的。
    2. 词组拆解（歧义路径 A）：识别出前半句「一个半 / 小时」指的是 1.5 小时，即 90 分钟。
    3. 词组拆解（歧义路径 B）：识别出后半句的文字游戏在于「三个 / 半小时」，即三个 30 分钟的累加。
    4. 建立等式：证明 $1.5 \times 60 \text{ min} = 90 \text{ min}$ 且 $3 \times 30 \text{ min} = 90 \text{ min}$。

    评分细则：
    1. 【完美回答】（100分）：
       - 指出这句话是一个基于断句/语法结构歧义的文字游戏。
       - 清晰说明「一个半 / 小时」（1.5h）和「三个 / 半小时」（3个0.5h）在时间跨度上是相等的（均为90分钟）。
       - 解释了为什么普通人在直觉上会觉得这句话矛盾（因为通常会将后者理解为 3.5 小时）。

    2. 【理解正确但表述一般】（80分）：
       - 能够算出两者都是 90 分钟。
       - 提到了断句的不同，但对语言学上的歧义性分析不够深入，或表达不够简洁明了。

    3. 【逻辑不全/仅从数学角度】（50分）：
       - 模型可能意识到了单位问题，但解释得含糊不清。例如仅说“因为三个半小时也可以指三个30分钟”，但没有对比 1.5 小时与 3.5 小时的认知冲突。

    4. 【一本正经的胡说八道】（20分）：
       - 模型试图用哲学、相对论或特殊的时区/历法来强行解释 1.5 等于 3.5 的合理性。

    5. 【完全错误/无法理解】（0分）：
       - 判定这句话完全错误，或者认为这是由于计算错误导致的，未能识别出文字游戏的本质。