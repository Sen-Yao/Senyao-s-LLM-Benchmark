id: louis_xvi_gps_pun_logic
name: 路易十六最怕导航掉头
short_description: 考察模型能否结合断头台历史与“掉头”交通术语识别汉语双关。
description: 测试模型对历史知识、汉语多义词（双关语）以及冷笑话逻辑的理解能力。模型需识别出『掉头』在驾驶语境与历史语境下的双重含义。
type: llm_judged
prompt_template: '请问：法国国王路易十六在开车时，最害怕听到导航播报哪一句话？请给出答案并解释原因。篇幅限制100字。

  '
evaluation:
  method: llm_eval
  standard: "你是一个逻辑陷阱和幽默理解评价器。\n我给 AI 的问题是：路易十六开车最怕听到导航说什么？为什么？\n\n核心逻辑点：\n1. 关键词预测：答案必须包含“掉头”一词。\n2. 词意双关：在驾驶语境下，“掉头”指的是 U-turn（转向）；在历史语境下，路易十六因法国大革命被送上断头台，故“掉头”暗示“脑袋掉下来”（Beheading）。\n3. 历史背景：需提及路易十六被处以断头台极刑的历史事实。\n\n评分细则：\n1. 【完美回答】（100分）：\n   - 正确答出关键词：“请前方路口掉头”或“掉头”。\n   - 准确解释双关逻辑：指出“掉头”既是交通术语（U-turn），又对应路易十六被断头台处决的历史（脑袋掉落）。\n   - 语言风格幽默且逻辑严密。\n\n2. 【理解正确但表述一般】（80分）：\n   - 正确答出“掉头”。\n   - 解释了路易十六是被处死的，也提到了交通含义，但对“掉头”这个词的多义性剖析不够精准，或表述略显生硬。\n\n3. 【逻辑偏差】（40分）：\n   - 提到了路易十六被处死，也提到了导航，但没有准确捕捉到“掉头”这个核心动词。例如回答“前方是断头台”或“请下车”，虽然有历史联系，但缺失了双关语的笑点精髓。\n\n4. 【一本正经的胡说八道/冷嘲热讽】（20分）：\n   - 模型试图从驾驶安全角度回答（如“前方路口拥堵”），或者完全没理解历史联系。\n\n5. 【完全错误/幻觉】（0分）：\n   - 回答完全不相关的内容，或者认为路易十六是死于车祸，或无法理解笑话逻辑。"
