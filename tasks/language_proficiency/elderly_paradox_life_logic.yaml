id: elderly_paradox_life_logic
name: "Elderly Paradox: 'Far yet Near' Philosophical Understanding Test"
description: "测试模型对文学悖论（Paradox）、多维语义分析以及中国传统生死观与亲情伦理的深度理解能力。模型需识别出『远』与『近』在物理时间、生命终点及心理共鸣三个维度的差异化逻辑。"
type: "llm_judged"

prompt_template: |
   请极简解析孤寡老人所说的：「过完年，我离母亲越来越远了，但也越来越近了」。
   要求：
      解释“远”：为何“过完年”会让距离拉长？
      解释“近”：为何“过完年”会让距离缩短？
   篇幅限制：总字数控制在 100 字以内，严禁感叹抒情和废话开场白。

evaluation:
  method: "llm_eval"
  standard: |
    你是一个文学评论家和中文语义深度解析评价器。
    我给 AI 的问题是：解释「过完年，我离母亲越来越远了，但也越来越近了」的逻辑。

    核心逻辑点：
    1. 维度的转换：识别出“远”和“近”是在两个完全不同的维度（或坐标系）下讨论的。
    2. “远”的逻辑（物理/时间）：
       - 指母亲去世后的客观时间在流逝。
       - “过完年”意味着又增加了一年，物理距离上的天人永隔在拉长。
    3. “近”的逻辑（生命/终点）：
       - 老人自身步入晚年，离生命的终点（死亡）越来越近。
       - 在老人的语境里，死亡意味着与母亲的重逢（归宿感）。
    4. “近”的逻辑（共鸣/身份 - 加分项）：
       - 老人体验到了母亲当年的衰老与孤独，在生命体验上达成了精神的高度重叠。

    评分细则：
    1. 【完美回答】（100分）：
       - 敏锐指出“远”是指客观时间的流逝（离母亲去世那一刻越久）。
       - 准确指出“近”是指生命归途的临近（老人离死亡越近，即离重逢越近）。
       - 能够分析出“过完年”作为时间节点的象征意义（生命减法）。
       - 语言优美，富有同理心，触及“向死而生”的哲学层面。

    2. 【理解全面】（80分）：
       - 准确解释了物理时间的“远”和生命终点的“近”。
       - 逻辑清晰，但可能缺乏对心理认同（如：活成了母亲的样子）等深层维度的挖掘。

    3. 【逻辑不全】（40分）：
       - 仅能解释其中一个维度（例如只说出老人想念母亲，或只说出老人快要去世了）。
       - 未能揭示出“远”与“近”之间看似矛盾实则对立统一的哲学关系。

    4. 【浅表误读】（20分）：
       - 认为老人在说地理距离（比如回老家又离开了）。
       - 无法识别出“母亲已逝”和“老人步入晚年”这两个隐含的背景前提。

    5. 【完全错误/幻觉】（0分）：
       - 解释为母亲还活着，或者认为这是一句病句，完全无法理解词义背后的象征性。