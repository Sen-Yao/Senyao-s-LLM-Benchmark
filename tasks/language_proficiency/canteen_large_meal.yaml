id: canteen_large_meal
name: 大份便餐拆字梗
short_description: 考察模型能否识别“大份便餐”删字后触发的谐音、拆字与排泄物联想。
description: 测试模型对中文多音多义字、谐音梗以及‘文字拆解’产生的语境突变感知能力。模型需识别出由于‘便’字（biàn）拆解后引发的排泄物联想及其带来的反差冲击感。
type: llm_judged
prompt_template: "食堂推出了“大份便餐”，有网友评论说：“这四个字无论去掉哪一个都很炸裂”。为什么？\n 请按以下格式直接输出结果，严禁废话：\n\n 去掉“餐”：[词组] -> [一句话解释炸裂含义]\n 去掉“份”：[词组] -> [一句话解释炸裂含义]\n 去掉“大”：[词组] -> [一句话解释炸裂含义]\n 去掉“便”：[词组] -> [一句话解释炸裂含义]\n"
evaluation:
  method: llm_eval
  standard: "你是一个中文互联网流行文化与语言逻辑评价器。\n该问题的核心是识别出词语拆解后，由于“便”字的多义性以及“大/份”作为量词修饰后产生的“恶俗排泄物”意图映射。\n\n核心逻辑点：\n1. 关键字定位：识别出“便”在拆解后从“简便/便餐”转化为“大便/排泄物”的含义。\n2. 谐音映射：识别出“大/份”与“大/粪”的谐音关联。\n3. 组合推导：\n   - 去掉“餐”：大份便 -> 映射为“大便”，且带分量描述。\n   - 去掉“份”：大便餐 -> 字面意思极其恶心（以大便为食）。\n   - 去掉“大”：份便餐 -> 谐音“粪便餐”。\n   - 去掉“便”：大份餐 -> 在该梗的特定逻辑下，谐音“大粪餐”。\n\n评分细则：\n1. 【完美回答】（100分）：\n   - 准确列出四个组合。\n   - 精确指出“便”字的语境偏移。\n   - 完整解释四个组合的逻辑：\n     * 去掉“餐”：大份便 -> 谐音“大粪便”；\n     * 去掉“份”：大便餐 -> 字面含义“以大便入餐”；\n     * 去掉“大”：份便餐 -> 谐音“粪便餐”；\n     * 去掉“便”：大份餐 -> 谐音“大粪餐”。\n   - 指出这种文字游戏带来的“反差视觉冲击力”。\n\n2. 【理解正确但稍逊】（80分）：\n   - 识别出了“大便”的核心梗。\n   - 解释了大部分组合的谐音，但可能漏掉一个（比如没意识到“大份餐”在这个语境下也属于谐音攻击）。\n\n3. 【逻辑偏差】（40分）：\n   - 意识到了这是个恶俗梗或搞笑梗。\n   - 但无法清晰解释每一个组合的逻辑，或者仅简单认为“大便”二字本身搞笑。\n\n4. 【一本正经的胡说八道】（20分）：\n   - 仅从字面逻辑解释，如认为“大份餐”是形容食堂分量多，不理解为何“炸裂”。\n   - 或者寻找毫无关联的谐音（如“便”谐音“变”）。\n\n5. 【完全错误/幻觉】（0分）：\n   - 无法识别任何幽默点或谐音点。\n   - 认为这是一个普通的食堂宣传语测试。"
