id: loquat_tree_literary_insult_logic
name: 庭院枇杷树的文学骂法
short_description: 考察模型能否从《项脊轩志》典故推导出网络语境中的隐晦诅咒。
description: 测试模型对古典文学典故《项脊轩志》及其在现代网络社交语境下演变为恶毒咒骂的逻辑解析能力。模型需识别出文本背后的‘丧偶’推导逻辑。
type: llm_judged
prompt_template: '请极简解析网络用语：「你爹今晚必在庭院里种一棵枇杷树」。

  要求：

  篇幅限制：直奔主题，严禁输出废话开场白或背景科普，总字数控制在 100 字以内。

  '
evaluation:
  method: llm_eval
  standard: "你是一个文学常识与网络亚文化逻辑评价器。\n该问题的核心是识别出文字背后的隐藏恶意及其文学源头。\n\n核心逻辑点：\n1. 文学溯源：必须提到明代散文家归有光的《项脊轩志》。\n2. 原文引用：必须包含关键句“庭有枇杷树，吾妻死之年所手植也”。\n3. 逻辑解构：\n   - 文中背景：种枇杷树的时间点是“妻子死之年”。\n   - 逻辑映射：你爹种树 = 你爹的妻子（即你的母亲）去世了。\n   - 攻击性识别：这是一种诅咒对方母亲去世（NMSL/双亲不全）的隐晦骂法。\n\n评分细则：\n1. 【完美回答】（100分）：\n   - 准确指出出处为归有光的《项脊轩志》。\n   - 准确引用原文：“庭有枇杷树，吾妻死之年所手植也”。\n   - 清晰解释逻辑：由于文中种树对应妻子去世，所以“你爹种树”暗指“你妈今晚必死”，识别出这是一种通过文学外壳包装的恶毒咒骂。\n   - 指出其作为网络“梗”或“祖安语”的攻击性。\n\n2. 【理解正确但稍逊】（80分）：\n   - 正确识别出处和原文。\n   - 解释了“种树”与“死妻”的关系，但逻辑推导过程稍显生硬，或者对网络社交语境下的恶意强度描述不足。\n\n3. 【逻辑偏差】（40分）：\n   - 提到了《项脊轩志》，也知道这是一句骂人的话，但无法清晰说明“种树”和“咒人亲属去世”之间的直接因果对应关系。\n   - 或者误以为这仅仅是对文学作品的恶搞，没意识到其在现代语境下的高度攻击性。\n\n4. 【一本正经的胡说八道】（20分）：\n   - 仅从字面意思解释，认为这是在描述由于绿化、园艺或咒语相关的温馨场景。\n   - 或者虽然觉得是坏话，但完全解释错了理由（例如解释成“枇杷”谐音“劈啪”等）。\n\n5. 【完全错误/幻觉】（0分）：\n   - 无法识别文学出处，或认为这句话是出自某部现代玄幻小说/电影。\n   - 无法理解任何谩骂或讽刺的含义。"
